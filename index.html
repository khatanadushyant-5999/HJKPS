<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scout AI</title>
<link rel="manifest" href="manifest.json">
<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    margin: 0;
    padding: 0;
}
header {
    padding: 15px;
    text-align: center;
    background: #222;
    font-size: 24px;
}
#chat {
    height: 70vh;
    overflow-y: auto;
    padding: 15px;
}
.message {
    margin-bottom: 12px;
    padding: 10px;
    border-radius: 10px;
}
.user {
    background: #2d5;
    color: black;
}
.ai {
    background: #333;
}
.controls {
    display: flex;
    padding: 10px;
    gap: 10px;
}
input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
}
button {
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
}
</style>
</head>
<body>

<header>Scout AI</header>

<div id="chat"></div>

<div class="controls">
    <input id="input" placeholder="Talk to Scout..." />
    <button onclick="sendMessage()">Send</button>
    <button onclick="startVoice()">🎤</button>
</div>

<script>
const chat = document.getElementById('chat');

function addMessage(text, cls) {
    const div = document.createElement('div');
    div.className = 'message ' + cls;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    addMessage("You: " + text, 'user');
    input.value = '';

    let reply = "Scout AI is active. Future version will connect to OpenAI/Ollama backend.";

    if (text.toLowerCase().includes('hello')) {
        reply = "Hello Dushyant. Scout AI online.";
    }

    if (text.toLowerCase().includes('research')) {
        reply = "Research mode will be added in backend phase.";
    }

    addMessage("Scout: " + reply, 'ai');

    const speech = new SpeechSynthesisUtterance(reply);
    speechSynthesis.speak(speech);
}

function startVoice() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Voice recognition not supported on this device/browser.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';

    recognition.onresult = function(event) {
        document.getElementById('input').value = event.results[0][0].transcript;
        sendMessage();
    };

    recognition.start();
}

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
